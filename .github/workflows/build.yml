name: Build, Test and Deploy Admin Service V2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Enables manual trigger ("Run workflow" button) in Gitea UI
  workflow_dispatch:

env:
  SOLUTION_FILE: "CleanArchitecture.sln"
  IMAGE_NAME: "admin-service-v2"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. BUILD & TEST .NET APPLICATION
  # ────────────────────────────────────────────────────────────────────────────
  build-test-dotnet:
    name: Build & Test .NET 9
    runs-on: ubuntu-latest  # Replace with [self-hosted, esma] if using a specific runner tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION_FILE }} --no-restore -c Release

      - name: Run unit tests
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} \
            --no-build \
            -c Release \
            -m:4 \
            --logger "trx;LogFileName=test-results.trx"

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2. BUILD & PUSH DOCKER IMAGE
  # ────────────────────────────────────────────────────────────────────────────
  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test-dotnet
    if: gitea.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Short Commit SHA
        id: vars
        run: echo "short_sha=$(echo ${{ gitea.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ vars.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/Web.Api/Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY TO SERVER VIA SSH
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-server:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: |
      (gitea.ref == 'refs/heads/main') ||
      (gitea.event_name == 'workflow_dispatch')
    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ vars.SSH_PRIVATE_KEY }}
          script: |
            cd ~/server-setup/esma
            chmod +x ./restart
            dos2unix restart
            ./restart esma-admin-api-v2

